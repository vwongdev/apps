apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - target-group.yaml

patches:
  # The load balancer reaches Pod IPs directly from inside the VPC.
  - target:
      kind: NetworkPolicy
      name: obsidian-mcp
    patch: |-
      - op: add
        path: /spec/ingress/0/from
        value:
          - ipBlock:
              cidr: 10.0.0.0/16
  # EBS volumes are zonal, so keep the Pod in one zone as Spot nodes come and go.
  - target:
      kind: Deployment
      name: obsidian-mcp
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: topology.kubernetes.io/zone
                      operator: In
                      values:
                        - us-east-1a
