# The MCP endpoint requires a token, so the load balancer checks the unauthenticated health endpoint.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: obsidian-mcp
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: obsidian-mcp
