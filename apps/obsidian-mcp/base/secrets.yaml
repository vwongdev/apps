# Sync credentials: OBSIDIAN_AUTH_TOKEN and optionally VAULT_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sync
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secrets
  target:
    name: sync
  dataFrom:
    - extract:
        key: obsidian-mcp-sync
