# Sync credentials: OBSIDIAN_AUTH_TOKEN, VAULT_NAME and optionally VAULT_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sync
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secrets
  target:
    name: sync
  dataFrom:
    - extract:
        key: obsidian-mcp-sync
---
# Identity provider settings shared by every deployment: ISSUER_URL and ALLOWED_SUBJECTS.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secrets
  target:
    name: mcp
  dataFrom:
    - extract:
        key: obsidian-mcp-server
