apiVersion: v1
kind: ServiceAccount
metadata:
  name: obsidian-mcp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-mcp
spec:
  replicas: 1
  # The vault volume is ReadWriteOnce, so the old Pod must release it first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obsidian-mcp
  template:
    metadata:
      labels:
        app: obsidian-mcp
    spec:
      serviceAccountName: obsidian-mcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: obsidian-mcp/mcp
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mcp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: vault
              mountPath: /vault
        - name: sync
          image: obsidian-mcp/sync
          envFrom:
            - configMapRef:
                name: sync
            - secretRef:
                name: sync
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: vault
              mountPath: /vault
            - name: sync-state
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: vault
        - name: sync-state
          persistentVolumeClaim:
            claimName: sync-state
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: obsidian-mcp
spec:
  selector:
    app: obsidian-mcp
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
  type: ClusterIP
