apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# Sync client state, kept so restarts resume instead of resyncing the whole vault.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sync-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
