# Providers restrict ingress sources to their load balancer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: obsidian-mcp
spec:
  podSelector:
    matchLabels:
      app: obsidian-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
