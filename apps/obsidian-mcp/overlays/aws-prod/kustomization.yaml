apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: obsidian-mcp

resources:
  - ../../providers/aws

patches:
  - target:
      kind: HTTPRoute
      name: obsidian-mcp
    patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - obsidian.api.vwong.dev

configMapGenerator:
  - name: mcp
    behavior: merge
    literals:
      - PUBLIC_URL=https://obsidian.api.vwong.dev
      - AUDIENCE=https://obsidian.api.vwong.dev

images:
  - name: obsidian-mcp/mcp
    newName: 788455525284.dkr.ecr.us-east-1.amazonaws.com/obsidian-mcp/mcp
    newTag: fa2fd44427ba729fff37541f6c9460b2d5de47f3
  - name: obsidian-mcp/sync
    newName: 788455525284.dkr.ecr.us-east-1.amazonaws.com/obsidian-mcp/sync
    newTag: fa2fd44427ba729fff37541f6c9460b2d5de47f3
