apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: obsidian-mcp

resources:
  - ../../providers/gcp

patches:
  - target:
      kind: HTTPRoute
      name: obsidian-mcp
    patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - obsidian.gcp.vwong.dev

configMapGenerator:
  - name: mcp
    literals:
      - PUBLIC_URL=https://obsidian.gcp.vwong.dev
      - AUDIENCE=https://obsidian.gcp.vwong.dev

images:
  - name: obsidian-mcp/mcp
    newName: us-east1-docker.pkg.dev/vwongdev-kube/kube/obsidian-mcp/mcp
    newTag: f2bffb9292108f3670319bb620a2306860aacce5
  - name: obsidian-mcp/sync
    newName: us-east1-docker.pkg.dev/vwongdev-kube/kube/obsidian-mcp/sync
    newTag: f2bffb9292108f3670319bb620a2306860aacce5
