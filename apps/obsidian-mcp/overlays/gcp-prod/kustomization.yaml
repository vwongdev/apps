apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: obsidian-mcp

resources:
  - ../../providers/gcp

patches:
  - target:
      kind: HTTPRoute
      name: obsidian-mcp
    patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - obsidian.gcp.vwong.dev

configMapGenerator:
  - name: mcp
    behavior: merge
    literals:
      - PUBLIC_URL=https://obsidian.gcp.vwong.dev
      - AUDIENCE=https://obsidian.gcp.vwong.dev

images:
  - name: obsidian-mcp/mcp
    newName: us-west4-docker.pkg.dev/vwongdev-kube/kube/obsidian-mcp/mcp
    newTag: fa2fd44427ba729fff37541f6c9460b2d5de47f3
  - name: obsidian-mcp/sync
    newName: us-west4-docker.pkg.dev/vwongdev-kube/kube/obsidian-mcp/sync
    newTag: fa2fd44427ba729fff37541f6c9460b2d5de47f3
